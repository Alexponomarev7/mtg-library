<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card Library</title>
<style>
:root{
  --bg:#f3f0e8;--panel:#fffdf8;--panel2:#f8f5ee;--ink:#1d1b18;--muted:#6f6a60;--line:#e1dacb;
  --accent:#2e6b5b;--accent-soft:#dcebe5;--accent-ink:#fff;--warn:#b0502c;--warn-soft:#f6e3da;
  --ghost:.30;--radius:10px;--shadow:0 1px 2px rgba(30,25,15,.06),0 6px 18px rgba(30,25,15,.07);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141619;--panel:#1d2024;--panel2:#23272c;--ink:#ebe7de;--muted:#9b968c;--line:#31353b;
  --accent:#5ab69a;--accent-soft:#1f3a32;--accent-ink:#0d1411;--warn:#e38a63;--warn-soft:#3b2620;--shadow:none;
  --ghost:.5;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.hwrap{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-weight:750;letter-spacing:-.01em;font-size:18px;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:14px;height:19px;border-radius:2px;background:var(--accent);box-shadow:4px -3px 0 -1px var(--bg),4px -3px 0 0 var(--accent)}
nav{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tab{border:0;background:none;padding:6px 14px;border-radius:7px;color:var(--muted);font-weight:600}
.tab.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
#stats{margin-left:auto;color:var(--muted);font-size:13px}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.view[hidden]{display:none}
.muted{color:var(--muted)}.small{font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;font-weight:600}
a.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center}
.btn:disabled{opacity:.45;cursor:default}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:3px 9px;font-size:13px}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;width:30px;height:30px;display:inline-grid;place-items:center;font-weight:700}
input[type=text],input[type=number],input:not([type]),select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.searchbar input.big{flex:1;min-width:220px;font-size:17px;padding:11px 14px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
h3.sub{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;vertical-align:2px;background:var(--panel2);border:1px solid var(--line)}
.badge.foil{background:linear-gradient(90deg,#f3d27a,#b7e3f0,#e6b7f0);color:#222;border:0}
/* find */
.row-item{display:grid;grid-template-columns:52px 1fr minmax(180px,auto) auto;gap:14px;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px}
.thumb{width:52px;aspect-ratio:63/88;border-radius:4px;object-fit:cover;background:var(--panel2)}
.ri-name{font-weight:650}
.ri-meta{color:var(--muted);font-size:13px}
.loc-store{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.loc-big{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;flex:none}
.ri-act{display:flex;gap:6px}
@media (max-width:700px){.row-item{grid-template-columns:44px 1fr}.ri-loc,.ri-act{grid-column:2}}
/* add */
.add-grid{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media (max-width:900px){.add-grid{grid-template-columns:1fr}}
.sticky{position:sticky;top:74px}
.print-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.print{border:2px solid transparent;background:none;padding:0;text-align:left;border-radius:9px;position:relative}
.print img{width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:7px;display:block;background:var(--panel2)}
.print.sel{border-color:var(--accent)}
.p-meta{display:block;font-size:12px;padding:4px 2px;color:var(--muted);line-height:1.3}
.p-meta b{color:var(--ink)}
.owned{position:absolute;top:6px;right:6px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px}
#add-panel{padding:16px}
.ap-head{display:flex;gap:12px;margin-bottom:12px}
.ap-head img{width:110px;border-radius:7px;aspect-ratio:63/88;object-fit:cover}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.opts label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);gap:3px}
.opts label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.sug{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px 12px;margin-bottom:8px;position:relative}
.sug:hover{border-color:var(--accent)}
.sug.best{border-color:var(--accent);background:var(--accent-soft)}
.sug-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.sug-pos{font-weight:750;font-size:17px;margin:2px 0;font-variant-numeric:tabular-nums}
.tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sug .pmap{position:absolute;right:12px;bottom:10px;width:46px}
.pmap{display:grid;gap:2px;width:72px}
.pmap i{aspect-ratio:63/88;border-radius:2px;background:var(--line)}
.pmap i.on{background:var(--accent)}
.placed{background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center}
.placed .pmap i{background:rgba(255,255,255,.28)}.placed .pmap i.on{background:var(--accent-ink)}
@media (prefers-color-scheme:dark){.placed .pmap i{background:rgba(0,0,0,.25)}}
.pl-label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;opacity:.85}
.pl-store{font-weight:700;font-size:16px}
.pl-pos{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap;white-space:nowrap}
.pl-sub{font-size:12.5px;opacity:.85}
.notes{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.owned-list{font-size:13px;margin:0 0 12px;padding:0;list-style:none}
.owned-list li{padding:3px 0;border-bottom:1px solid var(--line)}
.other{display:flex;gap:6px;margin-top:6px}
.other select{flex:1;min-width:0}
/* storage */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.st-card{padding:14px 16px;text-align:left;border-left:5px solid var(--c,var(--accent));cursor:pointer;background:var(--panel)}
.st-card:hover{border-color:var(--muted);border-left-color:var(--c,var(--accent))}
.st-name{font-weight:700;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.chip{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);text-transform:uppercase}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--c,var(--accent))}
.detail-head{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.detail-grid{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
@media (max-width:900px){.detail-grid{grid-template-columns:1fr}}
.sets-panel{padding:14px}
.set-list{list-style:none;margin:0 0 10px;padding:0}
.set-row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.seticon{width:20px;height:20px;object-fit:contain}
@media (prefers-color-scheme:dark){.seticon{filter:invert(.9)}}
.set-ctl{display:flex;gap:3px}
.set-ctl .icon-btn{width:26px;height:26px;font-size:12px}
.set-opts{grid-column:2/4;display:flex;gap:12px;font-size:12.5px;color:var(--muted)}
.set-opts label{display:flex;gap:4px;align-items:center}
.set-opts{flex-wrap:wrap;row-gap:2px}
.space{margin:4px 0 14px;font-size:12.5px}
.space-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);margin:6px 0 8px}
.space-bar i{display:block;height:100%}
.space-row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.space-row span:first-child{display:flex;gap:6px;align-items:center}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.picker{position:relative}
.picker input{width:100%}
.picker ul{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:300px;overflow:auto;z-index:5}
.picker li{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
.picker li:hover,.picker li.act{background:var(--accent-soft)}
.pager{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.pager .info{color:var(--muted);font-size:13px}
.binder-page{display:grid;gap:10px;background:var(--panel2);padding:14px;border-radius:var(--radius);border:1px solid var(--line);max-width:600px}
.pocket{aspect-ratio:63/88;border-radius:7px;position:relative;padding:0;border:0;background:none;overflow:hidden}
.pocket img{width:100%;height:100%;object-fit:cover;display:block;border-radius:7px}
.pocket.empty{border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;background:var(--panel)}
.pocket.expect img{opacity:var(--ghost);filter:grayscale(1)}
.pocket.expect:hover img{opacity:.6}
.exp-label{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 6px;font-size:11.5px;font-weight:600;background:linear-gradient(transparent,var(--panel) 60%);color:var(--ink);text-align:left;line-height:1.2}
.price-chip{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:700;padding:1px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.price-chip.ghost{top:5px;bottom:auto;left:auto;right:5px;opacity:.85}
.money{font-variant-numeric:tabular-nums;font-weight:650}
.foil-dot{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#f3d27a,#b7e3f0,#e6b7f0);font-size:10px;font-weight:800;color:#222;display:grid;place-items:center}
.pocket.hl{outline:3px solid var(--accent);outline-offset:2px;animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{outline-color:transparent}}
.box-list .sec{margin:14px 0 6px;font-weight:700}
.box-row{display:grid;grid-template-columns:36px 1fr auto auto auto auto;gap:10px;align-items:center;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:5px}
.box-row img{width:36px;aspect-ratio:63/88;border-radius:3px;object-fit:cover}
/* collections */
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.set-card{padding:14px 16px;text-align:left;cursor:pointer;border:1px solid var(--line)}
.set-card:hover{border-color:var(--muted)}
.set-card .seticon{width:26px;height:26px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:12px;color:var(--muted)}
.btable{width:100%;border-collapse:collapse;font-size:13.5px}
.btable th{text-align:right;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650;padding:6px 8px;border-bottom:1px solid var(--line)}
.btable td{text-align:right;padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.btable th:first-child,.btable td:first-child{text-align:left}
.verdict{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:5px}
.verdict.good{background:var(--accent-soft);color:var(--accent)}
.verdict.meh{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.verdict.bad{background:var(--warn-soft);color:var(--warn)}
.table-wrap{overflow-x:auto}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.ccard{position:relative;display:block;border-radius:7px;overflow:hidden}
.ccard img{width:100%;aspect-ratio:63/88;object-fit:cover;display:block;border-radius:7px;background:var(--panel2)}
.ccard.miss img{opacity:var(--ghost);filter:grayscale(1)}
.ccard.miss:hover img{opacity:.7}
.ccard .cn{display:block;font-size:11.5px;color:var(--muted);padding:3px 2px 0;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .price-chip{top:5px;right:5px;left:auto;bottom:auto}
.ccard .own{position:absolute;top:5px;left:5px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--ink)}
.prow{display:grid;grid-template-columns:1fr 90px 90px 90px 150px;gap:10px;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;text-align:left;width:100%}
.prow:hover{border-color:var(--muted)}
.prow.open{border-color:var(--accent)}
.prow .n{font-weight:650}
.prow .num{text-align:right;font-variant-numeric:tabular-nums}
.prow-head{display:grid;grid-template-columns:1fr 90px 90px 90px 150px;gap:10px;padding:0 12px 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650}
.prow-head span:not(:first-child){text-align:right}
.pdetail{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:-2px 0 10px}
.plist{list-style:none;margin:0;padding:0;font-size:13px;columns:2 260px;column-gap:24px}
.plist li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line);break-inside:avoid}
.plist li.new b{color:var(--accent)}
@media (max-width:700px){.prow,.prow-head{grid-template-columns:1fr 80px 80px}.prow .hide-s,.prow-head .hide-s{display:none}}
/* decks */
.deck-card{padding:0;overflow:hidden;cursor:pointer;border:1px solid var(--line);display:grid;grid-template-columns:86px 1fr}
.deck-card:hover{border-color:var(--muted)}
.deck-card img{width:86px;height:100%;min-height:120px;object-fit:cover;object-position:50% 12%;background:var(--panel2)}
.deck-card .b{padding:12px 14px;min-width:0}
.dk-add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.dk-add .picker{flex:1;min-width:240px}
.dk-sec{margin:16px 0 6px;font-weight:700;display:flex;justify-content:space-between}
.dk-row{display:grid;grid-template-columns:58px 30px 1fr 110px 70px 118px 30px;gap:10px;align-items:center;padding:5px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:4px}
.dk-row input[type=number]{width:58px;padding:4px 6px}
.dk-row img{width:30px;aspect-ratio:63/88;border-radius:3px;object-fit:cover}
.dk-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-row select{padding:4px 6px;font-size:13px}
.have{font-size:12px;font-weight:700;color:var(--accent)}.need{font-size:12px;font-weight:700;color:var(--warn)}
@media (max-width:700px){.dk-row{grid-template-columns:52px 1fr 70px 30px}.dk-row img,.dk-row .hide-s{display:none}}
.info{position:relative;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font:700 11px/1 Georgia,serif;font-style:italic;cursor:help;flex:none}
.info:hover,.info:focus{color:var(--ink);border-color:var(--ink);outline:none}
.info .tip{display:none;position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:min(380px,86vw);z-index:20;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.25);
  padding:12px 14px;font:400 12.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:left;cursor:default}
.info:hover .tip,.info:focus .tip,.info:focus-within .tip{display:block}
.info .tip b{font-weight:700}.info .tip p{margin:0 0 8px}.info .tip p:last-child{margin:0}
/* dialogs */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;max-width:min(520px,94vw);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,10,10,.45)}
.dlg{padding:18px 20px}
.dlg h3{margin:0 0 12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.form .full{grid-column:1/-1}
.form label.chk{flex-direction:row;align-items:center;gap:7px;color:var(--ink);font-size:14px}
.radio-card{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)!important;font-size:14px!important;flex-direction:row!important}
.radio-card small{display:block;color:var(--muted)}
.presets{display:flex;gap:5px;flex-wrap:wrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0}
.form label.swatch{position:relative;flex-direction:row;cursor:pointer}
.swatch input{position:absolute;opacity:0;pointer-events:none}
.swatch span{width:22px;height:22px;border-radius:50%;display:block;box-shadow:0 0 0 1px var(--line)}
.swatch input:checked+span{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.swatch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:4px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.pocket-dlg{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px}
.pocket-dlg img{width:100%;border-radius:9px}
@media (max-width:520px){.pocket-dlg{grid-template-columns:1fr}}
.moves li{padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.moves b{display:block}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:90vw}
#toast.show{opacity:1}#toast.err{background:var(--warn);color:#fff}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo"><i></i>Card Library</div>
  <nav>
    <button class="tab active" data-tab="find">Find</button>
    <button class="tab" data-tab="add">Add cards</button>
    <button class="tab" data-tab="storage">Binders &amp; boxes</button>
    <button class="tab" data-tab="collections">Collections</button>
    <button class="tab" data-tab="decks">Decks</button>
  </nav>
  <div id="stats"></div>
</div></header>

<main>
  <section id="view-find" class="view">
    <div class="searchbar">
      <input id="find-q" class="big" placeholder="Where is my card?  Type a name, or set + number like “blb 12”" autocomplete="off">
      <a class="btn" href="/api/export.csv">Export CSV</a>
    </div>
    <div id="find-results"></div>
  </section>

  <section id="view-add" class="view" hidden>
    <div class="add-grid">
      <div>
        <div class="searchbar">
          <input id="add-q" class="big" placeholder="Card name, “blb 12”, or name + number like “Mountain 288”" autocomplete="off">
          <input id="add-set" placeholder="Set code" style="width:110px" autocomplete="off">
          <button class="btn primary" id="add-go">Search</button>
        </div>
        <div id="add-results"><div class="empty">Search Scryfall for a card, then pick the exact printing you hold.</div></div>
      </div>
      <aside id="add-panel" class="panel sticky"><p class="muted" style="margin:0">Pick a printing to see where it goes.</p></aside>
    </div>
  </section>

  <section id="view-storage" class="view" hidden>
    <div id="storage-list-wrap">
      <div class="toolbar">
        <button class="btn primary" data-new="binder">+ New binder</button>
        <button class="btn" data-new="box">+ New box</button>
        <button class="btn" id="refresh-prices" style="margin-left:auto">Update prices</button>
        <button class="btn" id="refresh-sets">Refresh set list</button>
      </div>
      <div id="storage-list" class="st-grid"></div>
    </div>
    <div id="storage-detail" hidden></div>
  </section>

  <section id="view-collections" class="view" hidden>
    <div id="coll-list-wrap">
      <div class="toolbar"><div class="picker" style="flex:1;max-width:420px"><input id="coll-pick" placeholder="Look up any set (name or code)" autocomplete="off"><ul id="coll-opts" hidden></ul></div></div>
      <div id="coll-list" class="set-grid"></div>
    </div>
    <div id="coll-detail" hidden></div>
  </section>

  <section id="view-decks" class="view" hidden>
    <div id="deck-list-wrap">
      <div class="toolbar"><button class="btn primary" id="deck-new">+ New deck</button><button class="btn" id="deck-precon">From a precon</button></div>
      <div id="deck-list" class="set-grid"></div>
    </div>
    <div id="deck-detail" hidden></div>
  </section>
</main>

<dialog id="dlg-storage"><form class="dlg" method="dialog" id="storage-form"></form></dialog>
<dialog id="dlg-pocket"><div class="dlg" id="pocket-body"></div></dialog>
<dialog id="dlg-addset"><form class="dlg" method="dialog" id="addset-form"></form></dialog>
<dialog id="dlg-deck"><div class="dlg" id="deck-dlg-body"></div></dialog>
<dialog id="dlg-moves"><div class="dlg" id="moves-body"></div></dialog>
<div id="toast"></div>

<script>
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){
  const r=await fetch(path,{method:opts.method||'GET',headers:opts.body?{'Content-Type':'application/json'}:{},body:opts.body?JSON.stringify(opts.body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||('Error '+r.status));
  return j;
}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
let toastT;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='show '+(kind||'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',kind==='err'?4500:2200)}
const LANGS=[['en','English'],['nl','Dutch'],['ru','Russian'],['de','German'],['fr','French'],['it','Italian'],['es','Spanish'],['pt','Portuguese'],['ja','Japanese'],['ko','Korean'],['zhs','Chinese (S)'],['zht','Chinese (T)']];
const cmUrl=c=>c.cardmarket_id?`https://www.cardmarket.com/en/Magic/Products?idProduct=${c.cardmarket_id}`
  :`https://www.cardmarket.com/en/Magic/Products/Search?searchString=${encodeURIComponent(c.name)}`;
const cmBtn=c=>`<a class="btn" href="${esc(cmUrl(c))}" target="_blank" rel="noopener" title="Open this printing on Cardmarket">Cardmarket ↗</a>`;
const eur=v=>v==null?'—':'€'+Number(v).toFixed(2);
const LANG_NAME=Object.fromEntries(LANGS);
const langName=k=>LANG_NAME[k]||k;
const CONDS=['NM','LP','MP','HP','DMG'];
const COLORS=['#2e6b5b','#3b5b9a','#8a3f6e','#b0502c','#a5832a','#55606e','#6b4fb0','#2f8a8f'];

const S={tab:'find',storages:[],cur:null,page:1,highlight:null,sug:null,results:[],
  opt:{foil:false,cond:'NM',lang:'en',qty:1},pageSlots:[]};

function pocketMap(rows,cols,r,c){
  let h=`<div class="pmap" style="grid-template-columns:repeat(${cols},1fr)">`;
  for(let i=1;i<=rows;i++)for(let j=1;j<=cols;j++)h+=`<i class="${i===r&&j===c?'on':''}"></i>`;
  return h+'</div>';
}
const dot=c=>`<span class="dot" style="background:${esc(c||'var(--accent)')}"></span>`;

/* ------------------------------------------------------------ tabs & stats */
function setTab(t){
  S.tab=t;
  $$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  $$('.view').forEach(v=>v.hidden=v.id!=='view-'+t);
  if(t==='find'){runFind();$('#find-q').focus()}
  if(t==='add')$('#add-q').focus();
  if(t==='storage'){if(S.cur)openStorage(S.cur.id,S.page);else loadStorages()}
  if(t==='collections'){if(S.coll)openSet(S.coll);else loadCollections()}
  if(t==='decks'){if(S.deck)openDeck(S.deck);else loadDecks()}
}
$$('.tab').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='storage'&&S.tab==='storage'){S.cur=null}if(b.dataset.tab==='collections'&&S.tab==='collections'){S.coll=null}if(b.dataset.tab==='decks'&&S.tab==='decks'){S.deck=null}setTab(b.dataset.tab)});
async function loadStats(){
  try{const s=await api('/api/stats'),el=$('#stats');S.prices=s.prices;
    el.innerHTML=`${s.cards} cards · ${s.unique} unique · ${s.storages} places · <b class="money" style="color:var(--ink)">${eur(s.value)}</b>`;
    el.title=s.prices.date?`Prices: ${s.prices.source}, ${s.prices.date.slice(0,10)}`:'Prices not downloaded yet'}catch(e){}
}

/* ------------------------------------------------------------ find */
function locHtml(it){
  if(it.kind==='binder'){
    if(!it.loc)return `<div class="loc-store">${dot(it.color)}${esc(it.storage_name)}</div><div class="loc-big" style="color:var(--warn)">no pocket</div>`;
    return `<div class="loc-store">${dot(it.color)}${esc(it.storage_name)}</div><div class="loc-big">Page ${it.loc.page} · Row ${it.loc.row} · Col ${it.loc.col}</div>`;
  }
  return `<div class="loc-store">${dot(it.color)}${esc(it.storage_name)} (box)</div><div class="loc-big">${esc(it.section||'—')}</div>`;
}
function itemRow(it){
  return `<div class="row-item">
    <img class="thumb" src="${esc(it.image)}" loading="lazy" alt="">
    <div><div class="ri-name">${esc(it.name)} ${it.foil?'<span class="badge foil">Foil</span>':''}</div>
      <div class="ri-meta">${esc(it.set_name||'')} · ${esc(it.set_code.toUpperCase())} #${esc(it.collector_number)} · ${esc(it.condition)} · ${esc(langName(it.lang))}${it.qty>1?` · <b>×${it.qty}</b>`:''}
        · <span class="money">${eur(it.price)}</span>${it.qty>1&&it.price!=null?` <span class="muted">(${eur(it.price*it.qty)})</span>`:''}</div></div>
    <div class="ri-loc">${locHtml(it)}</div>
    <div class="ri-act"><button class="btn sm" data-edit="${it.id}">Edit</button>${it.kind==='binder'&&it.slot!=null?`<button class="btn sm" data-show="${it.storage_id}:${it.slot}">Show</button>`:`<button class="btn sm" data-showbox="${it.storage_id}">Open</button>`}
      <button class="btn sm danger" data-del="${it.id}">Remove${it.qty>1?' 1':''}</button></div>
  </div>`;
}
let findSeq=0;
const runFind=debounce(async()=>{
  const q=$('#find-q').value.trim(),el=$('#find-results'),seq=++findSeq;
  try{
    const items=await api('/api/items?q='+encodeURIComponent(q));
    S.findItems=items;
    if(seq!==findSeq)return;
    el.innerHTML=items.length?(q?'':'<h3 class="sub">Recently added</h3>')+items.map(itemRow).join('')
      :`<div class="empty">${q?'Not found in your collection.':S.storages.length?'No cards yet. Go to Add cards to put your first one away.':'Your collection is empty. Create a binder or box, then add cards.'}</div>`;
  }catch(e){el.innerHTML=`<div class="empty">${esc(e.message)}</div>`}
},180);
$('#find-q').addEventListener('input',runFind);
$('#find-results').addEventListener('click',async e=>{
  const s=e.target.closest('[data-show]');
  if(s){const[sid,slot]=s.dataset.show.split(':').map(Number);return showSlot(sid,slot)}
  const ed=e.target.closest('[data-edit]');
  if(ed){const it=S.findItems.find(x=>x.id===+ed.dataset.edit);if(it)openBoxItem(it,{id:it.storage_id,name:it.storage_name,kind:it.kind},()=>{runFind();loadStats()});return}
  const b=e.target.closest('[data-showbox]');
  if(b){S.cur={id:+b.dataset.showbox};S.page=1;return setTab('storage')}
  const d=e.target.closest('[data-del]');
  if(d){if(!confirm('Remove this card from your collection?'))return;
    try{await api('/api/items/'+d.dataset.del+'?one=1',{method:'DELETE'});toast('Removed');runFind();loadStats()}catch(err){toast(err.message,'err')}}
});
async function showSlot(sid,slot){
  const st=await api('/api/storages/'+sid);
  S.cur=st;S.page=Math.floor(slot/(st.rows*st.cols))+1;S.highlight=slot;setTab('storage');
}

/* ------------------------------------------------------------ add */
let addSeq=0;
async function runAddSearch(){
  const q=$('#add-q').value.trim(),set=$('#add-set').value.trim(),el=$('#add-results'),seq=++addSeq;
  if(!q&&!set){return}
  el.innerHTML='<div class="empty">Searching Scryfall…</div>';
  try{
    const cards=await api(`/api/cards/search?q=${encodeURIComponent(q)}&set=${encodeURIComponent(set)}`);
    if(seq!==addSeq)return;
    S.results=cards;
    el.innerHTML=cards.length?`<h3 class="sub">${cards.length} printing${cards.length>1?'s':''} — pick the one you hold</h3><div class="print-grid">${cards.map((c,i)=>
      `<button class="print" data-i="${i}" title="${esc(c.name)}"><img src="${esc(c.image)}" loading="lazy" alt="${esc(c.name)}">
       <span class="p-meta"><b>${esc(c.set_code.toUpperCase())} #${esc(c.collector_number)}</b> · <span class="money">${eur(c.price??c.price_foil)}</span><br>${esc(c.set_name||'')}</span>
       ${c.owned?`<span class="owned">own ${c.owned}</span>`:''}</button>`).join('')}</div>`
      :'<div class="empty">No cards found.</div>';
    if(cards.length===1)selectPrinting(0);
  }catch(e){el.innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
$('#add-go').onclick=runAddSearch;
$('#add-q').addEventListener('keydown',e=>{if(e.key==='Enter')runAddSearch()});
$('#add-set').addEventListener('keydown',e=>{if(e.key==='Enter')runAddSearch()});
$('#add-results').addEventListener('click',e=>{const b=e.target.closest('.print');if(b)selectPrinting(+b.dataset.i)});
async function selectPrinting(i){
  $$('.print').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i));
  const c=S.results[i];
  $('#add-panel').innerHTML='<div class="empty">Finding a spot…</div>';
  try{renderAddPanel(await api('/api/suggest',{method:'POST',body:{card_id:c.id}}))}
  catch(e){$('#add-panel').innerHTML=`<div class="notes">${esc(e.message)}</div>`}
}
function placedHtml(it){
  if(it.kind==='binder'&&it.loc)return `<div class="placed"><div><div class="pl-label">Put it in</div><div class="pl-store">${esc(it.storage_name)}</div>
    <div class="pl-pos"><span>Page ${it.loc.page}</span><span>Row ${it.loc.row}</span><span>Col ${it.loc.col}</span></div>
    ${it.loc.side?`<div class="pl-sub">Sheet ${it.loc.sheet}, ${it.loc.side} side</div>`:''}</div>${pocketMap(it.rows,it.cols,it.loc.row,it.loc.col)}</div>`;
  return `<div class="placed"><div><div class="pl-label">Put it in</div><div class="pl-store">${esc(it.storage_name)}</div>
    <div class="pl-pos" style="font-size:18px">${esc(it.section||'')}</div>${it.qty>1?`<div class="pl-sub">You now have ${it.qty} there</div>`:''}</div></div>`;
}
function renderAddPanel(r,placed){
  S.sug=r;const c=r.card,o=S.opt;
  const sugg=r.suggestions.map((s,i)=>`<button class="sug ${i===0?'best':''}" data-sid="${s.storage_id}" data-slot="${s.slot??''}">
      <div class="sug-top"><span style="display:flex;gap:6px;align-items:center">${dot(s.color)}<b>${esc(s.storage_name)}</b></span><span class="tag">${i===0?'best spot':s.kind+(s.general?' · general':'')}</span></div>
      <div class="sug-pos">${s.kind==='binder'?`Page ${s.loc.page} · Row ${s.loc.row} · Col ${s.loc.col}`:esc(s.section||'')}</div>
      <div class="muted small" style="padding-right:56px">${esc(s.reason)}${s.loc&&s.loc.side?` · sheet ${s.loc.sheet} ${s.loc.side}`:''}</div>
      ${s.kind==='binder'?pocketMap(s.rows,s.cols,s.loc.row,s.loc.col):''}</button>`).join('');
  $('#add-panel').innerHTML=`
    ${placed?placedHtml(placed):''}
    <div class="ap-head"><img src="${esc(c.image_large||c.image)}" alt="">
      <div><div style="font-weight:700;font-size:16px">${esc(c.name)}</div>
      <div class="muted small">${esc(c.set_name||'')}<br>${esc(c.set_code.toUpperCase())} #${esc(c.collector_number)} · ${esc(c.rarity||'')}</div>
      <div class="muted small" style="margin-top:6px">${esc(c.type_line||'')}</div>
      <div class="small" style="margin-top:6px"><span class="money">${eur(c.price)}</span> <span class="muted">· foil ${eur(c.price_foil)}</span>
        · <a href="${esc(cmUrl(c))}" target="_blank" rel="noopener" style="color:var(--accent)">Cardmarket ↗</a></div></div></div>
    <div class="opts">
      <label class="chk"><input type="checkbox" id="o-foil" ${o.foil?'checked':''}> Foil</label>
      <label>Copies <small>(boxes)</small><input type="number" id="o-qty" min="1" value="${o.qty}"></label>
      <label>Condition<select id="o-cond">${CONDS.map(x=>`<option ${x===o.cond?'selected':''}>${x}</option>`).join('')}</select></label>
      <label>Language<select id="o-lang">${LANGS.map(([k,v])=>`<option value="${k}" ${k===o.lang?'selected':''}>${v}</option>`).join('')}</select></label>
    </div>
    ${r.owned.length?`<h3 class="sub">You own ${r.owned.reduce((a,x)=>a+x.qty,0)}</h3><ul class="owned-list">${r.owned.map(x=>`<li>${x.foil?'<span class="badge foil">F</span> ':''}${esc(x.location)}${x.qty>1?` ×${x.qty}`:''}</li>`).join('')}</ul>`:''}
    ${r.notes.map(n=>`<div class="notes">${esc(n)}</div>`).join('')}
    ${sugg?`<h3 class="sub">Where to put it</h3>${sugg}`:''}
    <h3 class="sub" style="margin-top:14px">Somewhere else</h3>
    <div class="other"><select id="o-store">${S.storages.map(s=>`<option value="${s.id}">${esc(s.name)} (${s.kind})</option>`).join('')}</select>
      <button class="btn" id="o-put">Put here</button></div>`;
  $('#o-foil').onchange=e=>o.foil=e.target.checked;
  $('#o-qty').onchange=e=>o.qty=Math.max(1,+e.target.value||1);
  $('#o-cond').onchange=e=>o.cond=e.target.value;
  $('#o-lang').onchange=e=>o.lang=e.target.value;
  $$('#add-panel .sug').forEach(b=>b.onclick=()=>putCard(+b.dataset.sid,b.dataset.slot===''?null:+b.dataset.slot));
  $('#o-put').onclick=()=>{const v=$('#o-store').value;if(v)putCard(+v,null)};
  if(!S.storages.length)api('/api/storages').then(l=>{S.storages=l;if(S.sug===r)$('#o-store').innerHTML=l.map(s=>`<option value="${s.id}">${esc(s.name)} (${s.kind})</option>`).join('')});
}
async function putCard(storage_id,slot){
  const c=S.sug.card,o=S.opt;
  try{
    const r=await api('/api/items',{method:'POST',body:{card_id:c.id,storage_id,slot:slot??'auto',foil:o.foil,condition:o.cond,lang:o.lang,qty:o.qty}});
    o.qty=1;
    const sug=await api('/api/suggest',{method:'POST',body:{card_id:c.id}});
    renderAddPanel(sug,r.item);
    const ri=S.results.findIndex(x=>x.id===c.id);
    if(ri>=0){const n=S.results[ri].owned=sug.owned.reduce((a,x)=>a+x.qty,0),tile=$(`.print[data-i="${ri}"]`);
      if(tile){let b=$('.owned',tile);if(!b){b=document.createElement('span');b.className='owned';tile.append(b)}b.textContent='own '+n}}
    loadStats();
  }catch(e){toast(e.message,'err')}
}

/* ------------------------------------------------------------ storage list */
async function refreshStorages(){S.storages=await api('/api/storages');return S.storages}
async function loadStorages(){
  S.cur=null;$('#storage-detail').hidden=true;$('#storage-list-wrap').hidden=false;
  await refreshStorages();
  const el=$('#storage-list');
  if(!S.storages.length){el.innerHTML='<div class="empty" style="grid-column:1/-1">No binders or boxes yet. Create your first one above.</div>';return}
  el.innerHTML=S.storages.map(s=>{
    const cap=s.capacity_total,pct=cap?Math.min(100,Math.round(100*s.count/cap)):0;
    return `<div class="panel st-card" style="--c:${esc(s.color||'')}" data-open="${s.id}">
      <div style="display:flex;justify-content:space-between"><span class="st-name">${esc(s.name)}</span><span class="tag">${s.deck?'deck box':s.kind}</span></div>
      <div class="muted small">${s.kind==='binder'?`${s.page_count} pages · ${s.rows}×${s.cols} pockets · ${s.mode==='set_order'?'set order':'fill in order'}`:(s.capacity?`holds ${s.capacity}`:'no size limit')}</div>
      <div class="chips">${s.deck?'<span class="muted small">holds its deck only</span>':s.sets.length?s.sets.map(x=>`<span class="chip" title="${esc(x.name||'')}">${esc(x.set_code)}</span>`).join(''):'<span class="muted small">any set (general)</span>'}</div>
      <div class="small" style="display:flex;justify-content:space-between"><span><b>${s.count}</b>${cap?` / ${cap}`:''} cards</span><span class="money">${eur(s.value)}</span></div>${cap?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}
      ${s.space&&s.mode==='set_order'?`<div class="muted small" style="margin-top:6px">${s.space.reserved} reserved by sets · ${s.space.free} pockets unreserved</div>`:''}
    </div>`}).join('');
}
$('#storage-list').addEventListener('click',e=>{const c=e.target.closest('[data-open]');if(c)openStorage(+c.dataset.open,1)});
$$('[data-new]').forEach(b=>b.onclick=()=>storageForm(b.dataset.new));
$('#refresh-prices').onclick=async()=>{toast('Downloading Cardmarket prices…');
  try{const r=await api('/api/prices/refresh',{method:'POST'});toast(`Prices updated (${(r.prices.date||'').slice(0,10)}) · collection ${eur(r.value)}`);loadStats();loadStorages()}
  catch(e){toast(e.message,'err')}};
$('#refresh-sets').onclick=async()=>{toast('Refreshing sets from Scryfall…');try{const r=await api('/api/sets/refresh',{method:'POST'});toast(`Set list updated (${r.sets} sets)`)}catch(e){toast(e.message,'err')}};

function storageForm(kind,st){
  const s=st||{kind,name:'',sheets:20,rows:3,cols:3,double_sided:1,mode:'set_order',capacity:'',color:COLORS[Math.floor(Math.random()*COLORS.length)],notes:''};
  const locked=st&&st.count>0;
  const f=$('#storage-form');
  f.innerHTML=`<h3>${st?'Edit':'New'} ${kind}</h3><div class="form">
    <label class="full">Name<input name="name" value="${esc(s.name)}" required placeholder="${kind==='binder'?'e.g. Bloomburrow binder':'e.g. Bulk box 1'}"></label>
    ${kind==='binder'?`
      <label>Sheets (plastic pages)<input type="number" name="sheets" min="1" value="${s.sheets}"></label>
      <label class="chk" style="align-self:end"><input type="checkbox" name="double_sided" ${s.double_sided?'checked':''} ${locked?'disabled':''}> Cards on both sides</label>
      <label>Rows per page<input type="number" name="rows" min="1" max="8" value="${s.rows}" ${locked?'disabled':''}></label>
      <label>Columns per page<input type="number" name="cols" min="1" max="8" value="${s.cols}" ${locked?'disabled':''}></label>
      ${locked?'':`<div class="full presets"><span class="muted small">Pocket layout:</span>${[[3,3],[3,4],[2,2],[4,3],[2,3]].map(([r,c])=>`<button type="button" class="btn sm" data-rc="${r},${c}">${r*c}-pocket (${r}×${c})</button>`).join('')}</div>`}
      <div class="full" style="display:grid;gap:6px">
        <label class="radio-card"><input type="radio" name="mode" value="set_order" ${s.mode==='set_order'?'checked':''} ${locked?'disabled':''}><span><b>Set order</b><small>Each card has its own fixed pocket by collector number. Missing cards show as empty spots.</small></span></label>
        <label class="radio-card"><input type="radio" name="mode" value="sequential" ${s.mode==='sequential'?'checked':''} ${locked?'disabled':''}><span><b>Fill in order</b><small>Each new card goes into the next empty pocket.</small></span></label>
      </div>
      <div class="full muted small" id="cap-hint"></div>`
    :`<label class="full">Capacity (cards, optional)<input type="number" name="capacity" min="1" value="${s.capacity??''}" placeholder="e.g. 800"></label>`}
    <div class="full" style="font-size:12.5px;color:var(--muted)">Color<div class="swatches">${COLORS.map(c=>`<label class="swatch" title="${c}"><input type="radio" name="color" value="${c}" ${c===s.color?'checked':''}><span style="background:${c}"></span></label>`).join('')}</div></div>
    <label class="full">Notes<textarea name="notes" rows="2" placeholder="Where it is, brand, etc.">${esc(s.notes||'')}</textarea></label>
    ${locked?'<div class="full muted small">Pocket grid and filling mode are locked while the binder holds cards.</div>':''}
  </div>
  <div class="dlg-foot"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">${st?'Save':'Create'}</button></div>`;
  const hint=()=>{const h=$('#cap-hint',f);if(!h)return;const n=+f.sheets.value*(f.double_sided.checked?2:1),pp=+f.rows.value*+f.cols.value;h.textContent=`${n} pages × ${pp} pockets = ${n*pp} cards`};
  f.oninput=hint;hint();
  $$('[data-rc]',f).forEach(b=>b.onclick=()=>{const[r,c]=b.dataset.rc.split(',');f.rows.value=r;f.cols.value=c;hint()});
  const dlg=$('#dlg-storage');
  dlg.onclose=async()=>{
    if(dlg.returnValue!=='ok')return;
    const fd=new FormData(f),body={kind,name:fd.get('name'),color:fd.get('color'),notes:fd.get('notes')};
    if(kind==='binder'){Object.assign(body,{sheets:fd.get('sheets'),rows:f.rows.value,cols:f.cols.value,double_sided:f.double_sided.checked,mode:locked?s.mode:fd.get('mode')})}
    else body.capacity=fd.get('capacity');
    try{
      if(st){const r=await api('/api/storages/'+st.id,{method:'PUT',body});showMoves(r.moves);openStorage(st.id,S.page)}
      else{const r=await api('/api/storages',{method:'POST',body});toast('Created '+r.name);openStorage(r.id,1)}
      loadStats();refreshStorages();
    }catch(e){toast(e.message,'err')}
  };
  dlg.returnValue='';dlg.showModal();
}

          :st.sets.length?'':`<p class="muted small" style="margin-top:0">No sets assigned — this ${st.kind} accepts cards from any set.</p>`}

            ${setOrder?`<div class="set-opts"><label><input type="checkbox" data-np="${x.set_code}" ${x.new_page?'checked':''}> starts on new page</label><label><input type="checkbox" data-ex="${x.set_code}" ${x.include_extras?'checked':''}> include extras/variants</label><label><input type="checkbox" data-pc="${x.set_code}" ${x.one_per_card?'checked':''}> one pocket per card</label></div>`:''}

function askSetOptions(set){

    <div class="full" style="display:grid;gap:6px">
      <label class="radio-card"><input type="radio" name="per" value="print" checked><span><b>One pocket per printing</b><small>Every printing (regular, showcase, borderless…) gets its own pocket, in collector-number order.</small></span></label>
      <label class="radio-card"><input type="radio" name="per" value="card"><span><b>One pocket per card</b><small>One pocket for each card name. Any printing of it goes there; extra copies go to a box.</small></span></label>
    </div>
    <label class="chk full"><input type="checkbox" name="include_extras"> Include extras/variants</label>
    <label class="chk full"><input type="checkbox" name="new_page" checked> Start the set on a new page</label>
  </div>
  <div class="dlg-foot"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Add set</button></div>`;
  return new Promise(res=>{
    dlg.onclose=()=>res(dlg.returnValue==='ok'?{one_per_card:f.per.value==='card',include_extras:f.include_extras.checked,new_page:f.new_page.checked}:null);
    dlg.returnValue='';dlg.showModal();

function spaceHtml(st){
  const sp=st.space;if(!sp)return '';
  const cap=st.capacity_total,pct=n=>(100*n/cap).toFixed(2)+'%',pages=n=>{const p=n/sp.per_page;return p===Math.floor(p)?p:'≈'+p.toFixed(1)};
  const row=(color,label,n)=>`<div class="space-row"><span><i class="sw" style="background:${color}"></i>${label}</span><span><b>${n}</b> <span class="muted">· ${pages(n)} p.</span></span></div>`;
  const other=Math.max(0,cap-sp.reserved-sp.padding-sp.free);
  if(st.mode!=='set_order')return `<h3 class="sub">Space</h3><div class="space">
    <div class="space-bar"><i style="width:${pct(other)};background:var(--accent)"></i></div>
    ${row('var(--accent)','Used',other)}${row('var(--panel2)','Free',sp.free)}</div>`;
  const secs=(st.sections||[]).filter(x=>x.count),shades=[1,.7,.5,.35];
  const seg=(x,i)=>`<i title="${esc(x.name)}" style="width:${pct(Math.min(x.count,Math.max(0,cap-x.start)))};background:var(--accent);opacity:${shades[i%4]}"></i>`;
  return `<h3 class="sub">Space</h3><div class="space">
    <div class="space-bar">${secs.map(seg).join('')}${sp.padding?`<i title="Blank" style="width:${pct(sp.padding)};background:var(--line)"></i>`:''}${other?`<i title="Other cards" style="width:${pct(other)};background:var(--warn)"></i>`:''}</div>
    ${secs.map((x,i)=>row(`color-mix(in srgb,var(--accent) ${shades[i%4]*100}%,transparent)`,`Reserved · ${esc(x.name)}`,x.count)).join('')}
    ${sp.padding?row('var(--line)','Blank (set starts on new page)',sp.padding):''}
    ${other?row('var(--warn)','Other cards after the sets',other):''}
    ${row('var(--panel2)','Unreserved, free',sp.free)}
    <div class="space-row muted"><span>Total</span><span>${cap} pockets · ${st.page_count} p.</span></div></div>`;
}
function bindSetPicker(st,setCall){
  const inp=$('#set-pick'),ul=$('#set-opts');let list=[],act=0;
  const draw=()=>{ul.hidden=!list.length;ul.innerHTML=list.map((s,i)=>`<li class="${i===act?'act':''}" data-code="${s.code}"><img class="seticon" src="${esc(s.icon||'')}" alt=""><span><b>${esc(s.name)}</b> <span class="muted small">${s.code.toUpperCase()} · ${esc((s.released_at||'').slice(0,4))} · ${s.printed_size||s.card_count||'?'} cards</span></span></li>`).join('')};
  const pick=async code=>{ul.hidden=true;inp.value='';
    const setOrder=st.kind==='binder'&&st.mode==='set_order';
    const opts=setOrder?await askSetOptions(list.find(s=>s.code===code)||{code,name:code}):{};
    if(!opts)return;
    if(setOrder)toast('Loading set cards from Scryfall…');
    setCall(api(`/api/storages/${st.id}/sets`,{method:'POST',body:{set_code:code,...opts}}))};
  inp.addEventListener('input',debounce(async()=>{const q=inp.value.trim();if(!q){list=[];return draw()}try{list=await api('/api/sets?q='+encodeURIComponent(q));act=0;draw()}catch(e){toast(e.message,'err')}},200));
  inp.addEventListener('keydown',e=>{if(ul.hidden)return;if(e.key==='ArrowDown'){act=Math.min(act+1,list.length-1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){act=Math.max(act-1,0);draw();e.preventDefault()}else if(e.key==='Enter'&&list[act]){pick(list[act].code)}else if(e.key==='Escape')ul.hidden=true});
  ul.addEventListener('mousedown',e=>{const li=e.target.closest('li');if(li){e.preventDefault();pick(li.dataset.code)}});
  inp.addEventListener('blur',()=>setTimeout(()=>ul.hidden=true,150));
}
async function loadPage(n){
  const st=S.cur;

  S.page=r.page;S.pageSlots=r.slots;
  const hl=S.highlight;S.highlight=null;

  $('#st-content').innerHTML=`
    <div class="pager">
      <button class="btn" id="pg-prev" ${r.page<=1?'disabled':''}>←</button>
      <select id="pg-sel">${opts.join('')}</select>
      <button class="btn" id="pg-next" ${r.page>=r.page_count?'disabled':''}>→</button>
      <span class="info">${r.side?`Sheet ${r.sheet}, ${r.side}`:`Sheet ${r.sheet}`} of ${st.sheets}${r.sections.length?' · '+esc(r.sections.join(', ')):''}</span>
    </div>
    <div class="binder-page" style="grid-template-columns:repeat(${st.cols},minmax(0,1fr))">
      ${r.slots.map(s=>{const h=s.slot===hl?'hl':'';
        if(s.item)return `<button class="pocket ${h}" data-slot="${s.slot}" title="${esc(s.item.name)} — R${s.row} C${s.col}"><img src="${esc(s.item.image_large||s.item.image)}" alt="${esc(s.item.name)}" loading="lazy">${s.item.foil?'<span class="foil-dot">F</span>':''}${s.item.price!=null?`<span class="price-chip">${eur(s.item.price)}</span>`:''}</button>`;
        if(s.expected)return `<button class="pocket expect ${h}" data-slot="${s.slot}" title="Missing: ${esc(s.expected.name)}"><img src="${esc(s.expected.image_large||s.expected.image)}" alt="" loading="lazy"><span class="exp-label">#${esc(s.expected.collector_number)} ${esc(s.expected.name)}</span>${(s.expected.price??s.expected.price_foil)!=null?`<span class="price-chip ghost">${eur(s.expected.price??s.expected.price_foil)}</span>`:''}</button>`;
        return `<div class="pocket empty ${h}"><span>R${s.row} · C${s.col}</span></div>`}).join('')}
    </div>
    <p class="muted small">Tip: use ← → keys to flip pages.</p>`;
  $('#pg-prev').onclick=()=>loadPage(S.page-1);
  $('#pg-next').onclick=()=>loadPage(S.page+1);
  $('#pg-sel').onchange=e=>loadPage(+e.target.value);
  $$('#st-content .pocket[data-slot]').forEach(b=>b.onclick=()=>openPocket(+b.dataset.slot));
  if(hl!=null){const el=$('.pocket.hl');if(el)el.scrollIntoView({block:'center',behavior:'smooth'})}
}
document.addEventListener('keydown',e=>{

  const pick=code=>{ul.hidden=true;inp.value='';openSet(code)};
  inp.addEventListener('input',debounce(async()=>{const q=inp.value.trim();if(!q){list=[];return draw()}try{list=await api('/api/sets?q='+encodeURIComponent(q));act=0;draw()}catch(e){toast(e.message,'err')}},200));
  inp.addEventListener('keydown',e=>{if(ul.hidden)return;if(e.key==='ArrowDown'){act=Math.min(act+1,list.length-1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){act=Math.max(act-1,0);draw();e.preventDefault()}else if(e.key==='Enter'&&list[act]){pick(list[act].code)}else if(e.key==='Escape')ul.hidden=true});
  ul.addEventListener('mousedown',e=>{const li=e.target.closest('li');if(li){e.preventDefault();pick(li.dataset.code)}});

function verdict(ev,price){
  if(ev==null||!price)return '';

}

const PCAT={booster_box:'Booster box',booster_pack:'Booster',bundle:'Bundle',deck:'Precon deck',multiple_decks:'Decks',
  limited_aid_tool:'Prerelease / draft kit',box_set:'Box set',deck_box:'Deck display',land_station:'Land station',starter_kit:'Starter kit'};
async function loadProducts(code,setName){
  const el=$('#sv-products'),reprints=!!S.reprints;el.dataset.loaded='1';
  el.innerHTML='<div class="empty">Loading products and decklists… the first time can take a minute.</div>';
  let r;try{r=await api(`/api/collection/${encodeURIComponent(code)}/products?reprints=${reprints?1:0}`)}catch(e){el.innerHTML=`<div class="empty">${esc(e.message)}</div>`;el.dataset.loaded='';return}
  if(S.coll!==code)return;
  const short=n=>n.startsWith(setName+' ')?n.slice(setName.length+1):n;
  const val=(p,v)=>p.cards.length||p.packs.some(x=>x.ev!=null)?eur(v):'<span class="muted" title="Not estimated: collector and special boosters vary too much">n/a</span>';
  el.innerHTML=`<div class="toolbar"><label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="rp" ${reprints?'checked':''}> Count reprints I own from other sets as not new</label>
      <span class="info" tabindex="0" aria-label="How this is calculated">i<span class="tip" role="tooltip">
        <p><b>Value</b>: every card in the product × its Cardmarket trend price (the foil price for foil cards). Boosters inside count at their estimated value: the average price per rarity × the booster's usual slots. Collector and special boosters aren't estimated.</p>
        <p><b>New to you</b>: only cards you don't own yet, and each of them once, so extra copies or a foil next to a non-foil add nothing. For boosters inside, the estimate counts only cards you don't own.</p>
        <p><b>Off</b> (default): a card counts as owned only if you have it <i>from that same set</i>. A Sol Ring printed in this precon is new to you even if you own a Sol Ring from Commander Masters.</p>
        <p><b>On</b>: owning the card in <i>any</i> printing from any set counts, so reprints you already have aren't new.</p></span></span></div>
    ${r.products.length?`<div class="prow-head"><span>Product</span><span>Cost</span><span>Value</span><span class="hide-s">New to you</span><span class="hide-s">Verdict</span></div>
    ${r.products.map((p,i)=>`<button class="prow" data-i="${i}"><span><span class="n">${esc(short(p.name))}</span><br><span class="muted small">${esc(PCAT[p.category]||p.category||'')}${p.set_code!==code?' · '+esc(p.set_code.toUpperCase()):''}</span></span>
      <span class="num money">${eur(p.cost)}</span><span class="num">${val(p,p.value)}</span><span class="num hide-s">${val(p,p.new_value)}</span>
      <span class="num hide-s">${p.cost&&(p.cards.length||p.packs.some(x=>x.ev!=null))?verdict(p.value,p.cost):''}</span></button><div class="pdetail" id="pd-${i}" hidden></div>`).join('')}`
    :'<div class="empty">MTGJSON lists no sealed products for this set.</div>'}
    <p class="muted small">Contents from MTGJSON, prices from Cardmarket (trend). Value counts every card at its price and boosters at their estimated value; <b>new to you</b> counts each card you don't own once. Collector and other special boosters aren't estimated (n/a). The verdict here includes bulk commons, so it reads higher than the booster verdict on the Cards &amp; boosters view, which leaves out cards under €0.50.</p>`;
  $('#rp').onchange=e=>{S.reprints=e.target.checked;loadProducts(code,setName)};
  $$('#sv-products .prow').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,d=$('#pd-'+i);
    if(!d.hidden){d.hidden=true;b.classList.remove('open');return}
    b.classList.add('open');d.hidden=false;d.innerHTML=productDetail(r.products[i],reprints)});
}
function productDetail(p,reprints){

  return `<div class="tiles">
      ${tile('Cost',eur(p.cost),p.cardmarket_id?`<a href="https://www.cardmarket.com/en/Magic/Products?idProduct=${p.cardmarket_id}" target="_blank" rel="noopener" style="color:var(--accent)">Cardmarket ↗</a>`:'not on Cardmarket')}
      ${tile('Value in cards',est?eur(p.value):'—',p.cost&&est?`${Math.round(100*p.value/p.cost)}% of the cost`:'')}

    ${p.cards.length?`<h3 class="sub">Cards inside (${p.cards.reduce((a,c)=>a+c.count,0)})</h3><ul class="plist">${p.cards.map(c=>`<li class="${c.new?'new':''}"><span>${c.count>1?c.count+' × ':''}<a href="${esc(cmUrl(c))}" target="_blank" rel="noopener" style="color:var(--ink)">${esc(c.name)}</a> <span class="muted small">${esc(c.set_code.toUpperCase())} #${esc(c.collector_number)}${c.foil?' · foil':''}</span></span><b>${eur(c.unit==null?null:c.unit*c.count)}${c.new?' <span class="verdict good" style="padding:0 5px">new</span>':''}</b></li>`).join('')}</ul>`:''}
    ${p.other.length?`<p class="muted small" style="margin:10px 0 0">Also inside: ${p.other.map(esc).join(' · ')}</p>`:''}

    ${p.notes.map(n=>`<p class="muted small" style="margin:6px 0 0">${esc(n)}</p>`).join('')}`;
}

  const inp=$('#pc-set'),ul=$('#pc-opts');let list=[];inp.focus();
  const draw=()=>{ul.hidden=!list.length;ul.innerHTML=list.map(s=>`<li data-code="${s.code}"><img class="seticon" src="${esc(s.icon||'')}" alt=""><span><b>${esc(s.name)}</b> <span class="muted small">${s.code.toUpperCase()} · ${esc((s.released_at||'').slice(0,4))}</span></span></li>`).join('')};
  inp.addEventListener('input',debounce(async()=>{const q=inp.value.trim();if(!q){list=[];return draw()}try{list=(await api('/api/sets?q='+encodeURIComponent(q))).filter(s=>!['token','promo','memorabilia','alchemy','minigame'].includes(s.set_type));draw()}catch(e){toast(e.message,'err')}},200));
  ul.addEventListener('mousedown',async e=>{const li=e.target.closest('li');if(!li)return;e.preventDefault();ul.hidden=true;
    const s=list.find(x=>x.code===li.dataset.code);inp.value=s.name;const el=$('#pc-list');el.textContent='Loading decklists from MTGJSON…';
    try{const ps=await api('/api/precons?set='+encodeURIComponent(s.code));
      el.innerHTML=ps.length?ps.map((p,i)=>`<div class="box-row" style="grid-template-columns:1fr auto"><div><b>${esc(p.name)}</b><div class="muted small">${esc(p.type||'')} · ${p.cards} cards · ${esc(p.set_code.toUpperCase())}</div></div><button class="btn sm primary" data-pc="${i}">Create deck</button></div>`).join('')
        :'No precons listed for this set.';
      $$('[data-pc]',el).forEach(x=>x.onclick=async()=>{const p=ps[+x.dataset.pc];x.disabled=true;x.textContent='Creating…';
        try{const d=await api('/api/decks/from-precon',{method:'POST',body:{set_code:p.set_code,name:p.name,physical:$('#pc-phys').checked}});$('#dlg-deck').close();
          toast(`Created ${d.name} · ${d.stats.cards} cards`+(d.unresolved?` · ${d.unresolved} couldn't be matched`:''));openDeck(d.id)}
        catch(e){toast(e.message,'err');x.disabled=false;x.textContent='Create deck'}});
    }catch(e){el.textContent=e.message}});
};
async function openDeck(id){
  S.deck=id;$('#deck-list-wrap').hidden=true;const el=$('#deck-detail');el.hidden=false;
  let d;try{d=await api('/api/decks/'+id)}catch(e){toast(e.message,'err');return loadDecks()}
  if(S.deck!==id)return;renderDeck(d);
}
function renderDeck(d){
  const el=$('#deck-detail'),st=d.stats;
  const tile=(k,v,sub='')=>`<div class="panel tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
  const groups=['commander','main','side'].map(bd=>[bd,d.cards.filter(c=>c.board===bd)]).filter(([,cs])=>cs.length);
  el.innerHTML=`<div class="detail-head"><button class="btn" id="dk-back">← All decks</button>
      <div style="flex:1;min-width:200px"><h2>${esc(d.name)}</h2><div class="muted small">${esc(d.format||'No format')}${d.source?' · from '+esc(d.source):''}</div></div>
      ${d.physical?`<button class="btn" id="dk-box">Open deck box</button><button class="btn" id="dk-unown">Don’t own it</button>`:`<button class="btn primary" id="dk-own">I own this deck</button>`}
      <button class="btn" id="dk-edit">Edit</button><button class="btn" id="dk-import">Paste list</button><button class="btn" id="dk-export">Copy list</button><button class="btn danger" id="dk-del">Delete</button></div>
    <div class="tiles">${tile('Cards',st.cards,st.cards!==st.main?`${st.main} + ${st.cards-st.main} sideboard`:'')}${tile('Value',eur(st.value),'Cardmarket trend')}
      ${d.physical?tile('In its box',`${st.in_box} / ${st.cards}`,st.in_box<st.cards?'some cards are elsewhere':'complete'):tile('You own',`${st.owned} / ${st.cards}`,'any printing, any set')}${tile('Missing',eur(st.missing_cost),`${st.cards-st.owned} card${st.cards-st.owned===1?'':'s'} to buy`)}</div>
    <div class="dk-add"><div class="picker"><input id="dk-q" placeholder="Add a card: name, or “blb 12”" autocomplete="off"><ul id="dk-opts" hidden></ul></div>
      <select id="dk-board">${Object.entries(BOARD_NAME).map(([k,v])=>`<option value="${k}" ${k==='main'?'selected':''}>${v}</option>`).join('')}</select></div>
    ${groups.length?groups.map(([bd,cs])=>`<div class="dk-sec"><span>${BOARD_NAME[bd]} (${cs.reduce((a,c)=>a+c.qty,0)})</span><span class="money small">${eur(cs.reduce((a,c)=>a+(c.price||0)*c.qty,0))}</span></div>
      ${cs.map(c=>`<div class="dk-row" data-dc="${c.id}"><input type="number" min="0" value="${c.qty}" data-qty title="0 removes it">
        <img src="${esc(c.image)}" alt="" loading="lazy">
        <span class="nm"><a href="${esc(cmUrl(c))}" target="_blank" rel="noopener" style="color:var(--ink);font-weight:600">${esc(c.name)}</a> <span class="muted small">${esc(c.set_code.toUpperCase())} #${esc(c.collector_number)}${c.foil?' · foil':''}</span></span>
        <span class="hide-s" title="${esc(c.where.join('\n'))}">${d.physical?(c.in_box>=c.qty?'<span class="have">✓ in box</span>':`<span class="need">${c.qty-c.in_box} not in box</span>`):c.missing?`<span class="need">need ${c.missing}</span>${c.owned?` <span class="muted small">(have ${c.owned})</span>`:''}`:`<span class="have">✓ owned</span>`}</span>
        <span class="money small" style="text-align:right">${eur(c.price==null?null:c.price*c.qty)}</span>
        <select data-board class="hide-s">${Object.entries(BOARD_NAME).map(([k,v])=>`<option value="${k}" ${k===c.board?'selected':''}>${v}</option>`).join('')}</select>
        <button class="icon-btn" data-rm title="Remove">✕</button></div>`).join('')}`).join('')
    :'<div class="empty">This deck is empty. Add cards above, or paste a list.</div>'}
    <p class="muted small">${d.physical?'You own this deck: its cards are in the deck box “'+esc(d.name)+'”, and changing the list here adds or takes cards out of that box. Hover a card to see where your copies are.':'“Owned” counts copies of a card in any printing anywhere in your collection; hover it to see where they are.'}</p>`;
  $('#dk-back').onclick=loadDecks;
  if(d.physical){
    $('#dk-box').onclick=()=>{S.cur={id:d.storage_id};S.page=1;setTab('storage')};
    $('#dk-unown').onclick=()=>{const b=deckDialog(`<h3>You don’t own ${esc(d.name)} any more?</h3>
      <p class="small">Its deck box holds ${st.in_box} card${st.in_box===1?'':'s'}.</p>
      <div style="display:grid;gap:8px">
        <button class="btn" id="un-keep">Keep the cards: the deck box becomes an ordinary box</button>
        <button class="btn danger" id="un-drop">Remove the deck box and its cards from my collection</button></div>
      <div class="dlg-foot"><button class="btn" data-close>Cancel</button></div>`);
      $('#un-keep',b).onclick=()=>{$('#dlg-deck').close();call(api(`/api/decks/${d.id}/physical`,{method:'POST',body:{on:false,keep_cards:true}}),'The deck box is now an ordinary box');loadStats()};
      $('#un-drop',b).onclick=()=>{$('#dlg-deck').close();call(api(`/api/decks/${d.id}/physical`,{method:'POST',body:{on:false}}),'Deck box removed');loadStats()}};
  }else $('#dk-own').onclick=()=>{if(!confirm(`Add the ${st.cards} cards of “${d.name}” to your collection, in a new deck box?`))return;
    call(api(`/api/decks/${d.id}/physical`,{method:'POST',body:{on:true}}),'Cards added in the deck box “'+d.name+'”').then(()=>{loadStats();refreshStorages()})};
  const call=async(p,msg)=>{try{const r=await p;renderDeck(r);if(msg)toast(msg);if(r.physical||d.physical)loadStats()}catch(e){toast(e.message,'err')}};
  $$('.dk-row',el).forEach(row=>{const id=row.dataset.dc;
    $('[data-qty]',row).onchange=e=>call(api(`/api/decks/${d.id}/cards/${id}`,{method:'PUT',body:{qty:Math.max(0,+e.target.value||0)}}));
    $('[data-board]',row).onchange=e=>call(api(`/api/decks/${d.id}/cards/${id}`,{method:'PUT',body:{board:e.target.value}}));
    $('[data-rm]',row).onclick=()=>call(api(`/api/decks/${d.id}/cards/${id}`,{method:'DELETE'}))});
  $('#dk-del').onclick=async()=>{if(!confirm(d.physical?`Delete the deck “${d.name}”? Its deck box and cards stay in your collection as an ordinary box.`:`Delete the deck “${d.name}”? Your cards stay in your collection.`))return;try{await api('/api/decks/'+d.id,{method:'DELETE'});toast('Deleted');loadDecks()}catch(e){toast(e.message,'err')}};
  $('#dk-edit').onclick=()=>{const b=deckDialog(`<h3>Edit deck</h3><div class="form">
      <label class="full">Name<input id="de-name" value="${esc(d.name)}"></label>
      <label class="full">Format<select id="de-fmt"><option value="">—</option>${FORMATS.map(f=>`<option ${f===d.format?'selected':''}>${f}</option>`).join('')}</select></label>
      <label class="full">Notes<textarea id="de-notes" rows="3">${esc(d.notes||'')}</textarea></label></div>
      <div class="dlg-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="de-go">Save</button></div>`);
    $('#de-go',b).onclick=()=>{$('#dlg-deck').close();call(api('/api/decks/'+d.id,{method:'PUT',body:{name:$('#de-name').value,format:$('#de-fmt').value,notes:$('#de-notes').value}}),'Saved')}};
  $('#dk-import').onclick=()=>{const b=deckDialog(`<h3>Paste a list into ${esc(d.name)}</h3>
      <textarea id="di-text" rows="12" style="width:100%" placeholder="4 Lightning Bolt"></textarea>${listHelp}
      <div class="dlg-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="di-go">Add cards</button></div>`);
    $('#di-text').focus();
    $('#di-go',b).onclick=async()=>{const text=$('#di-text').value;$('#dlg-deck').close();toast('Looking up cards…');
      try{const r=await api(`/api/decks/${d.id}/import`,{method:'POST',body:{text}});renderDeck(r);importToast(r)}catch(e){toast(e.message,'err')}}};
  $('#dk-export').onclick=async()=>{
    const txt=groups.map(([bd,cs])=>(bd==='main'?'':BOARD_NAME[bd]+'\n')+cs.map(c=>`${c.qty} ${c.name} (${c.set_code.toUpperCase()}) ${c.collector_number}${c.foil?' *F*':''}`).join('\n')).join('\n\n');
    try{await navigator.clipboard.writeText(txt);toast('Decklist copied')}catch(e){deckDialog(`<h3>Decklist</h3><textarea rows="14" style="width:100%">${esc(txt)}</textarea><div class="dlg-foot"><button class="btn" data-close>Close</button></div>`)}};
  // add-card search
  const inp=$('#dk-q'),ul=$('#dk-opts');let list=[],act=0,seq=0;
  const draw=()=>{ul.hidden=!list.length;ul.innerHTML=list.map((c,i)=>`<li class="${i===act?'act':''}" data-i="${i}"><img src="${esc(c.image)}" alt="" style="width:26px;border-radius:2px"><span><b>${esc(c.name)}</b> <span class="muted small">${esc(c.set_code.toUpperCase())} #${esc(c.collector_number)} · ${eur(c.price??c.price_foil)}</span></span></li>`).join('')};
  const add=c=>{ul.hidden=true;inp.value='';list=[];call(api(`/api/decks/${d.id}/cards`,{method:'POST',body:{card_id:c.id,board:$('#dk-board').value}}),'Added '+c.name).then(()=>$('#dk-q')&&$('#dk-q').focus())};
  inp.addEventListener('input',debounce(async()=>{const q=inp.value.trim(),my=++seq;if(q.length<2){list=[];return draw()}
    try{const r=await api('/api/cards/search?q='+encodeURIComponent(q));if(my!==seq)return;list=r.slice(0,12);act=0;draw()}catch(e){toast(e.message,'err')}},300));
  inp.addEventListener('keydown',e=>{if(ul.hidden)return;if(e.key==='ArrowDown'){act=Math.min(act+1,list.length-1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){act=Math.max(act-1,0);draw();e.preventDefault()}else if(e.key==='Enter'&&list[act]){add(list[act])}else if(e.key==='Escape')ul.hidden=true});
  ul.addEventListener('mousedown',e=>{const li=e.target.closest('li');if(li){e.preventDefault();add(list[+li.dataset.i])}});
  inp.addEventListener('blur',()=>setTimeout(()=>ul.hidden=true,150));
}

/* ------------------------------------------------------------ boot */
loadStats();
api('/api/storages').then(l=>S.storages=l).catch(()=>{});
setTab('find');
</script>
</body>
</html>
